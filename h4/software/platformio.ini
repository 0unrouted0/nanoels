; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; pioarduino fork of platform-espressif32, pinned to the exact release this firmware was built
; and tested against: Arduino core 3.2.0 on ESP-IDF 5.4.1. Pinned by URI on purpose - a bare
; "espressif32" resolves to the official PlatformIO platform on a machine that does not already
; have this one installed, and that line is still on Arduino 2.0.x, which this code does not build
; against. Newer pioarduino releases exist (55.x moves to IDF 5.5); treat an update as its own
; change, verified on hardware.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=0
;lib_ldf_mode = deep+
lib_deps = 
	adafruit/Adafruit TCA8418@1.0.2
	adafruit/Adafruit BusIO@1.17.0
  arduino-libraries/LiquidCrystal@1.0.7
